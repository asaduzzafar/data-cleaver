# Tests on every push and pull request; the release workflow reuses this
# job, so a tag never builds an installer from code that fails its tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: sda/backend/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sda/frontend/package-lock.json

      # A venv at .venv, where the Playwright config looks for Python.
      - name: Python environment
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -r sda/backend/requirements-dev.txt

      - name: Backend tests
        working-directory: sda/backend
        run: ../../.venv/Scripts/python -m pytest -q

      - name: Frontend install
        working-directory: sda/frontend
        run: npm ci

      - name: Frontend unit tests
        working-directory: sda/frontend
        run: npm test

      # Builds the UI, starts the real app on a sample and audits every view
      # with axe in the runner's Chrome. Fails if any view gets worse than
      # tests/a11y/baseline.json.
      - name: Accessibility
        working-directory: sda/frontend
        run: npm run test:a11y
